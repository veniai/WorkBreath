<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkBreath · 无壳护眼回顾窗口</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1d1d1f;
        background: #dfe4ea;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 18%, rgba(255,255,255,.9), transparent 30%),
          linear-gradient(145deg, #edf1f5, #d9dee5);
      }
      .native-window {
        width: 720px;
        height: 600px;
        display: grid;
        place-items: center;
        padding: 24px;
        background: transparent;
      }
      .recap-card {
        width: 100%;
        max-height: 100%;
        overflow: auto;
        padding: 26px 28px 28px;
        border: 1px solid rgba(0, 0, 0, .10);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 32px rgba(0, 0, 0, .10);
      }
      .eyebrow { color: #86868b; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 8px 0 20px; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; }
      .total {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border: 1px solid rgba(0, 0, 0, .05);
        border-radius: 14px;
        background: #f8fafc;
      }
      .total span { color: #6e6e73; font-size: 13px; }
      .total strong { font-size: 1.85rem; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      h2 { margin: 20px 0 10px; color: #6e6e73; font-size: 13px; font-weight: 650; }
      ul { margin: 0; padding: 0; list-style: none; }
      li { display: flex; justify-content: space-between; gap: 18px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.05); font-size: 14px; }
      li b { flex: none; color: #86868b; font-size: 12px; font-weight: 500; }
      .actions { display: flex; justify-content: flex-end; margin-top: 24px; }
      .continue {
        min-height: 40px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #3b82f6;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .continue:hover { filter: brightness(1.08); }
      .closed { display: none; color: #6e6e73; font-size: 13px; }
      body.is-closed .native-window { display: none; }
      body.is-closed .closed { display: block; }
    </style>
  </head>
  <body>
    <section class="native-window" aria-label="720×600 透明无边框原生窗口">
      <article class="recap-card" role="dialog" aria-modal="true" aria-labelledby="recap-title">
        <div class="eyebrow">本轮回顾</div>
        <h1 id="recap-title">休息好了，看看刚才完成了什么</h1>
        <div class="total"><span>估算的有效屏幕使用记录</span><strong>37 分钟</strong></div>
        <div class="grid">
          <div>
            <h2>主要应用</h2>
            <ul>
              <li><span>Visual Studio Code</span><b>19 分钟</b></li>
              <li><span>Chrome</span><b>11 分钟</b></li>
              <li><span>Figma</span><b>7 分钟</b></li>
            </ul>
          </div>
          <div>
            <h2>主要网站</h2>
            <ul>
              <li><span>github.com</span><b>7 分钟</b></li>
              <li><span>docs.rs</span><b>3 分钟</b></li>
            </ul>
          </div>
        </div>
        <div class="actions"><button class="continue" type="button" data-close>继续</button></div>
      </article>
    </section>
    <p class="closed" role="status">整扇原生窗口已关闭，没有空白外壳。</p>
    <script>
      document.querySelector("[data-close]").addEventListener("click", () => {
        document.body.classList.add("is-closed");
      });
    </script>
  </body>
</html>
