name: Security Audit

# 依赖漏洞扫描：每周 + 锁文件变更时。处理截屏/OCR/HTTP 上传/AES 的应用必须盯 CVE。
on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC
  push:
    branches: [main, master]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit（Rust CVE）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit（新增 unsound 告警视为失败）
        run: >-
          cargo audit --deny unsound
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2026-0097
          --ignore RUSTSEC-2026-0186
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
        # 已知基线：
        # - 0429: Tauri Linux/WebKitGTK 的 glib 0.18，应用未使用受影响的 VariantStrIter 方法。
        # - 0097: tauri-utils 代码生成链路的 build-only rand 0.7。
        # - 0186: screenshots 0.8 -> libwayshot 的 memmap2 0.7，上游尚无可升级版本。
        # - 0194/0195: screenshots 0.8 生成代码解析内嵌 Wayland/XCB XML，不处理用户输入。

  npm-audit:
    name: npm audit（前端依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit（仅运行时依赖,高危及以上视为失败）
        # 门禁只看会进最终产物的运行时依赖;vite/svelte 等构建工具链
        # (devDependencies) 的漏洞不随应用分发,单独展示不作为失败条件。
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit（含构建工具链,仅报告不拦截）
        run: npm audit || true
