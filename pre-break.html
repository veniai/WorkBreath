<!DOCTYPE html>
<html lang="zh-CN" style="background: transparent">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkBreath Break Notice</title>
    <!--
      This window must be transparent before JavaScript and the component CSS
      load. Keeping the reset in this dedicated entry also isolates the native
      popup from app.css's opaque :root canvas.
    -->
    <style>
      :root,
      body,
      #app {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pre-break.js"></script>
  </body>
</html>
